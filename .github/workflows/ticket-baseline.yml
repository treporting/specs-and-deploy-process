# The baseline of specs-and-deploy, started by the label baseline on one of its tickets (TOOL_27).
# The work is in baseline.yml of tools; see its README.md, section baseline. This repo holds no code:
# the steps take the version of Go from the tools. The tools are taken at the tag of their baseline:
# after the @ the commit of that tag, in tools-ref the tag; a pull request raises both. The commit,
# not the tag: GitHub does not find the build.yml baseline.yml calls where the tag is a signed one.
name: ticket-baseline

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.label.name == 'baseline'
    uses: treporting/tools/.github/workflows/baseline.yml@add906fae2670fbb2a9f8df0c3de1cf17a0e7221 # T047.0
    with:
      tools-ref: T047.0
      go-version-file: .build-steps/go.mod
    secrets: inherit
